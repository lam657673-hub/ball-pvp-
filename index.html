<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Physics Collision Simulator & Elemental Combat</title>
<script src="https://cdn.jsdelivr.net/.../phaser@3.../dist/phaser.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body {
background: #08080c;
color: #ffffff;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
overflow: hidden;
}
#game-container {
position: relative;
width: 500px;
height: 500px;
box-shadow: 0 10px 30px rgba(0,0,0,0.😎, 0 0 20px rgba(76, 175, 80, 0.2);
border-radius: 12px;
overflow: hidden;
border: 2px solid #222;
}
#admin-console {
display: none;
position: absolute;
bottom: 0;
left: 0;
width: 100%;
height: 180px;
background: rgba(10, 15, 10, 0.95);
border-top: 2px solid #00ff66;
font-family: 'Courier New', Courier, monospace;
font-size: 11px;
color: #00ff66;
padding: 8px;
z-index: 100;
flex-direction: column;
}
#console-logs {
flex: 1;
overflow-y: auto;
margin-bottom: 4px;
line-height: 1.4;
}
#console-input-row {
display: flex;
align-items: center;
gap: 6px;
}
#console-input {
flex: 1;
background: #000;
border: 1px solid #00aa44;
color: #00ff88;
padding: 4px 8px;
font-family: monospace;
outline: none;
border-radius: 4px;
}
#qte-overlay {
display: none;
position: absolute;
bottom: 60px;
left: 50%;
transform: translateX(-50%);
z-index: 90;
text-align: center;
pointer-events: auto;
}
.qte-btn {
width: 48px;
height: 48px;
margin: 4px;
font-size: 16px;
font-weight: bold;
background: #111;
color: #ffcc00;
border: 2px solid #ffcc00;
border-radius: 8px;
cursor: pointer;
box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
}
.qte-btn:active {
background: #ffcc00;
color: #000;
}
#admin-toggle-btn {
position: absolute;
top: 6px;
right: 6px;
z-index: 80;
background: #111;
border: 1px solid #4caf50;
color: #4caf50;
font-size: 9px;
padding: 3px 6px;
border-radius: 4px;
cursor: pointer;
}
</style>
</head>
<body>
<div id="game-container">
<button id="admin-toggle-btn">CONSOLE (~)</button>
<div id="admin-console">
<div id="console-logs">
<div>[SYSTEM TERMINAL INITIALIZED] Gõ /help để xem danh sách lệnh...</div>
</div>
<div id="console-input-row">
<span>&gt;</span>
<input type="text" id="console-input" placeholder="Nhập lệnh điều khiển..." />
</div>
</div>
<div id="qte-overlay">
<div style="font-size:12px; color:#ffd700; font-weight:bold; margin-bottom:4px; text-shadow:0 0 4px #000;">QUICK-TIME EVENT</div>
<div>
<button class="qte-btn" onclick="window.triggerQTE('W')">W</button>
</div>
<div>
<button class="qte-btn" onclick="window.triggerQTE('A')">A</button>
<button class="qte-btn" onclick="window.triggerQTE('S')">S</button>
<button class="qte-btn" onclick="window.triggerQTE('D')">D</button>
</div>
</div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
